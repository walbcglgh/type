<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打字練習｜Type Practice</title>
<meta name="description" content="中英文打字練習與注音符號鍵位學習，純靜態網頁。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⌨️</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="brand">
      <span class="logo">⌨</span>
      <span>打字練習<small>TYPE PRACTICE</small></span>
    </div>
    <button id="theme" class="icon-btn" type="button">☀️ 淺色</button>
  </header>

  <!-- 設定 -->
  <section class="card">
    <div class="row-label">
      <span>模式</span>
      <div class="seg">
        <button id="m-normal" type="button" aria-pressed="true">一般模式</button>
        <button id="m-learn" type="button" aria-pressed="false">學習模式</button>
      </div>
    </div>

    <div class="row-label" id="row-lang">
      <span>語言</span>
      <div class="seg">
        <button id="l-zh" type="button" aria-pressed="true">中文</button>
        <button id="l-en" type="button" aria-pressed="false">英文</button>
      </div>
    </div>

    <div class="row-label" id="row-timing">
      <span>計量方式</span>
      <div class="seg">
        <button id="t-time" type="button" aria-pressed="true">計時</button>
        <button id="t-text" type="button" aria-pressed="false">計字</button>
      </div>
    </div>

    <div class="row-label" id="row-duration">
      <span>秒數</span>
      <div class="seg">
        <button id="d-15" type="button" aria-pressed="false">15</button>
        <button id="d-30" type="button" aria-pressed="false">30</button>
        <button id="d-60" type="button" aria-pressed="true">60</button>
        <button id="d-120" type="button" aria-pressed="false">120</button>
      </div>
    </div>

    <div class="row-label" id="row-strict">
      <span>打錯時</span>
      <div class="seg">
        <button id="e-go" type="button" aria-pressed="true">可繼續往下打</button>
        <button id="e-fix" type="button" aria-pressed="false">要改對才能繼續</button>
      </div>
    </div>

    <div class="row-label" id="row-group" hidden>
      <span>練習範圍</span>
      <div class="seg">
        <button id="g-all" type="button" aria-pressed="true">全部</button>
        <button id="g-shengmu" type="button" aria-pressed="false">聲母</button>
        <button id="g-jiemu" type="button" aria-pressed="false">介音</button>
        <button id="g-yunmu" type="button" aria-pressed="false">韻母</button>
        <button id="g-tone" type="button" aria-pressed="false">聲調</button>
      </div>
    </div>

    <div class="row-label" id="row-hint" hidden>
      <span>黃色提示</span>
      <div class="seg">
        <button id="h-on" type="button" aria-pressed="true">開啟</button>
        <button id="h-off" type="button" aria-pressed="false">關閉</button>
      </div>
    </div>

    <div class="row-label" id="row-custom">
      <span>自訂文本</span>
      <div class="custom-box">
        <textarea id="custom" placeholder="貼上想練的文字，按「練習這段文字」"></textarea>
        <div class="actions">
          <button id="b-custom" class="btn" type="button">練習這段文字</button>
          <span class="hint">會以「計字」方式進行</span>
        </div>
      </div>
    </div>
  </section>

  <!-- 練習區 -->
  <section class="card">

    <!-- 一般模式 -->
    <div id="normalPane">
      <div class="stats">
        <div class="stat"><b id="sSpeed">0</b><span id="unit">字/分</span></div>
        <div class="stat"><b id="sAcc">100</b><span>正確率 %</span></div>
        <div class="stat"><b id="sErr">0</b><span>打錯字數</span></div>
        <div class="stat"><b id="sTime">60</b><span>秒</span></div>
      </div>

      <div class="typer" id="typer">
        <div class="text-view" id="view"></div>
        <input id="cap" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" tabindex="-1">
        <div class="ghost" id="ghost">準備好了，直接開始打字</div>
      </div>
      <div class="bar"><i id="bar"></i></div>

      <div class="actions">
        <button id="b-restart" class="btn primary" type="button">重新開始</button>
        <span class="hint">按 <kbd>Esc</kbd> 也可重來；打錯可用 <kbd>⌫</kbd> 修正</span>
      </div>
    </div>

    <!-- 學習模式 -->
    <div id="learnPane" hidden>
      <div class="learn-top">
        <div class="prompt-box">
          <div class="prompt-label">請按下這個注音符號</div>
          <div id="prompt" class="prompt">ㄅ</div>
          <div id="feedback" class="feedback"></div>
        </div>
        <div class="learn-stats">
          <div class="stat"><b id="lRight">0</b><span>答對</span></div>
          <div class="stat"><b id="lWrong">0</b><span>答錯</span></div>
          <div class="stat"><b id="lAcc">—</b><span>正確率</span></div>
          <div class="stat"><b><span id="lPos">1</span>/<span id="lTotal">37</span></b><span>題號</span></div>
        </div>
      </div>
      <div class="actions">
        <button id="b-new" class="btn primary" type="button">換一輪</button>
        <span class="hint">按對自動出下一題；按錯會紅燈提示，並留在原題</span>
      </div>
    </div>

    <!-- 結果 -->
    <div class="results" id="results">
      <div class="big">
        <div><b id="rMain">0</b><span id="rMainLab">速度</span></div>
        <div><b id="rAcc">0%</b><span id="rAccLab">正確率</span></div>
        <div><b id="rErr">0</b><span id="rErrLab">打錯字數</span></div>
        <div><b id="rHits">0</b><span id="rHitsLab">打對字數</span></div>
      </div>
      <p class="verdict" id="rVerdict"></p>
    </div>
  </section>

  <!-- 鍵盤 -->
  <section class="card" id="keyboardWrap" hidden>
    <h2>鍵盤對照（大千式／Windows・macOS 標準注音）</h2>
    <div class="kbd-wrap">
      <div class="keyboard" id="keyboard"></div>
    </div>
    <div class="klegend">
      <span><i class="lg-hint"></i>下一個該按的鍵</span>
      <span><i class="lg-hit"></i>按對了</span>
      <span><i class="lg-miss"></i>按錯了</span>
    </div>
  </section>

  <footer>
    純靜態網頁，資料存在你自己的瀏覽器裡。
  </footer>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
